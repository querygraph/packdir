[package]
name = "packdir"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Store directories of small files as SQLite archives, and use them like directories"
license = "Apache-2.0"
repository = "https://github.com/querygraph/packdir"

[features]
default = ["sqlite", "turso"]
sqlite = ["firstpair-tursolite/sqlite"]
turso = ["firstpair-tursolite/turso"]

[dependencies]
firstpair-tursolite = { git = "https://github.com/querygraph/tursolite", tag = "v0.2.0", default-features = false }
libc = "0.2"
md-5 = { version = "0.10", features = ["asm"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
sha2 = "0.10"

[lib]
name = "packdir"
path = "src/lib.rs"

[[bin]]
name = "packdir"
path = "src/bin/packdir.rs"

[profile.release]
opt-level = 3
lto = "thin"

[workspace]
