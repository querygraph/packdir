<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" font-family="Helvetica, Arial, sans-serif"><title>Which engine may open which file</title><desc>Files are in one of three states; the rules say which engine may read and write each.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b5563"/></marker></defs>
<rect width="1000" height="470" fill="#ffffff"/>
<rect x="20" y="20" width="960" height="56" rx="4" fill="#eaf1f4" stroke="#7fa6b7" stroke-width="1.5"/>
<text x="36" y="54" font-size="16" font-weight="700" fill="#153e51" text-anchor="start">File on disk</text>
<text x="260" y="54" font-size="16" font-weight="700" fill="#153e51" text-anchor="start">SQLite</text>
<text x="490" y="54" font-size="16" font-weight="700" fill="#153e51" text-anchor="start">Turso (WAL)</text>
<text x="760" y="54" font-size="16" font-weight="700" fill="#153e51" text-anchor="start">Turso (MVCC)</text>
<rect x="20" y="90" width="960" height="106" rx="4" fill="#e8f2e6" stroke="#7fa877" stroke-width="1.5"/>
<text x="36" y="126" font-size="15" font-weight="700" fill="#153e51" text-anchor="start">Standard, no auto-vacuum</text>
<text x="36" y="150" font-size="13" fill="#3b5563" text-anchor="start">made by Turso or</text>
<text x="36" y="168" font-size="13" fill="#3b5563" text-anchor="start">repack --engine turso</text>
<text x="260" y="130" font-size="14" fill="#153e51" text-anchor="start">reads, writes</text>
<text x="490" y="130" font-size="14" fill="#153e51" text-anchor="start">reads, writes</text>
<text x="760" y="130" font-size="14" fill="#153e51" text-anchor="start">reads, writes</text>
<rect x="20" y="208" width="960" height="106" rx="4" fill="#f6f0e2" stroke="#c0a15a" stroke-width="1.5"/>
<text x="36" y="244" font-size="15" font-weight="700" fill="#153e51" text-anchor="start">Standard, with auto-vacuum</text>
<text x="36" y="268" font-size="13" fill="#3b5563" text-anchor="start">made by SQLite</text>
<text x="36" y="286" font-size="13" fill="#3b5563" text-anchor="start">(the default)</text>
<text x="260" y="248" font-size="14" fill="#153e51" text-anchor="start">reads, writes</text>
<text x="490" y="248" font-size="14" fill="#153e51" text-anchor="start">refused to write; reads</text>
<text x="490" y="268" font-size="14" fill="#153e51" text-anchor="start">fall to SQLite</text>
<text x="760" y="248" font-size="14" fill="#153e51" text-anchor="start">refused</text>
<rect x="20" y="326" width="960" height="106" rx="4" fill="#f7e8e4" stroke="#c0806e" stroke-width="1.5"/>
<text x="36" y="362" font-size="15" font-weight="700" fill="#153e51" text-anchor="start">Unsealed MVCC</text>
<text x="36" y="386" font-size="13" fill="#3b5563" text-anchor="start">a crash mid-run</text>
<text x="36" y="404" font-size="13" fill="#3b5563" text-anchor="start">header bytes 255 255</text>
<text x="260" y="366" font-size="14" fill="#153e51" text-anchor="start">never: "not a database"</text>
<text x="490" y="366" font-size="14" fill="#153e51" text-anchor="start">opens it, recovers, seals</text>
<text x="760" y="366" font-size="14" fill="#153e51" text-anchor="start">opens it, recovers, seals</text>
<text x="500" y="458" font-size="15" fill="#3b5563" text-anchor="middle">firstpair-tursolite enforces this when a file is opened, for every caller, in Rust and in OCaml.</text>
</svg>
